<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #app {
            max-width: 800px;
            margin: 0 auto;
        }
        #colorPanel {
            background-color: #f8e0b0;
            padding: 10px;
            margin-bottom: 20px;
        }
        #fruitDesc {
            background-color: #8fecc0;
            padding: 10px;
        }
        .fruit-item {
            margin-bottom: 20px;
        }
    </style>
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="app">
        <div id="colorPanel">
            <h3>Available colors:</h3>
        </div>
        <section id="fruitDesc">My fruits</section>
    </div>

    <script src="./index.js"></script>
</body>
</html>
